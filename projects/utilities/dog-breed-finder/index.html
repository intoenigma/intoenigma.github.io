<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Breeds | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Canine Intelligence Protocols</h2>
                        <p>Coordinate and deconstruct visual data of various biological subspecies within a unified interface.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="display: flex; gap: 10px; border: 1px dashed #007185; background: #fbfbfb; padding: 20px;">
                            <select id="breed-select" class="form-control" style="flex: 1; height: 35px; font-weight: 600;">
                                <option value="">Query Subspecies Algorithm...</option>
                            </select>
                            <button id="fetch-btn" class="btn btn-primary" style="min-width: 180px; height: 35px; font-weight: 700;">INITIALIZE SCAN</button>
                        </div>

                        <div id="image-container" class="card" style="width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; border: 1px solid #ddd; padding: 0; box-shadow: inset 0 0 50px rgba(0,0,0,0.5);">
                            <div class="placeholder" style="color: #aaa; text-transform: uppercase; letter-spacing: 3px; font-size: 11px; font-weight: 700;">
                                <i class="fa-solid fa-dog fa-beat" style="margin-right: 10px; color: #007185;"></i>
                                Awaiting Data Input...
                            </div>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-microscope" style="margin-right: 5px; color: #B12704;"></i>
                            Biological Note: Visual archives synchronized with the global Dog CEO data protocol.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
