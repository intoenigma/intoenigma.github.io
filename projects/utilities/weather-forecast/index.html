<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Sky Cast Intelligence</h2>
                        <p>Deconstruct and analyze planetary atmospheric protocols for local temporal sectors.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; padding: 25px; border: 1px solid #ddd; display: flex; gap: 10px;">
                            <input type="text" id="city" placeholder="Specify Geographic Vector (e.g. London)..." class="form-control" style="flex: 1; height: 40px; font-weight: 600;">
                            <button id="search-btn" class="btn btn-primary" style="height: 40px; font-weight: 700; padding: 0 25px;">QUERY STATUS</button>
                        </div>

                        <div id="weather-card" class="weather-card hidden card" style="background: linear-gradient(135deg, #007185 0%, #004d5a 100%); color: #fff; text-align: center; padding: 40px; border: none; border-radius: 8px;">
                            <h1 id="temp" style="font-size: 72px; font-weight: 800; margin: 0; letter-spacing: -2px;">--°C</h1>
                            <p id="desc" style="font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;">Condition Architecture</p>
                            <div class="details" style="display: flex; justify-content: center; gap: 40px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 25px;">
                                <div style="display: flex; flex-direction: column; gap: 5px;">
                                    <span style="font-size: 11px; opacity: 0.8; font-weight: 700;">WIND VELOCITY</span>
                                    <span id="wind" style="font-weight: 700; font-size: 18px;">--</span>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 5px;">
                                    <span style="font-size: 11px; opacity: 0.8; font-weight: 700;">HUMIDITY INDEX</span>
                                    <span id="humid" style="font-weight: 700; font-size: 18px;">--</span>
                                </div>
                            </div>
                        </div>
                        
                        <p style="font-size: 11px; color: #565959; margin-top: 25px; text-align: center; font-style: italic;">
                            <i class="fa-solid fa-satellite" style="margin-right: 5px; color: #007185;"></i>
                            Data synchronized via Open-Meteo Planetary Surveillance Network.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
