<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Temporal Intelligence Analytics</h2>
                        <p>Sequential deconstruction and synchronization of historical event protocols across the unified timeline.</p>
                    </header>

                    <div class="tool-content">
                        <div id="timeline" style="position: relative; padding: 40px 0 40px 45px; margin-top: 20px; border-left: 2px solid #007185;">
                            <!-- Event nodes injected dynamically -->
                            <div class="timeline-node-placeholder" style="text-align: center; padding: 60px; color: #888;">
                                <i class="fa-solid fa-clock-rotate-left fa-spin" style="font-size: 24px; color: #007185; margin-bottom: 15px; display: block;"></i>
                                <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Synchronizing Temporal Nodes...</span>
                            </div>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-hourglass-half" style="margin-right: 5px; color: #007185;"></i>
                            Analytics Note: Temporal synchronization aligns with standardized chronological deconstruction protocols.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
