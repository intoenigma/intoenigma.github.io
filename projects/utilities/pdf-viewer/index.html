<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Document Intelligence</h2>
                        <p>Visualize and analyze portable document protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid #ddd;">
                            <input type="file" id="file-in" accept="application/pdf" class="form-control" style="max-width: 250px; height: 35px; border-radius: 4px;">
                            <div class="page-controls" style="display: flex; align-items: center; gap: 10px;">
                                <button id="prev" class="btn" style="height: 35px; padding: 0 15px;">&larr;</button>
                                <span id="page-num" style="font-size: 13px; font-weight: 700; color: #565959;">0 / 0</span>
                                <button id="next" class="btn" style="height: 35px; padding: 0 15px;">&rarr;</button>
                            </div>
                        </div>

                        <div class="canvas-container card" style="width: 100%; min-height: 600px; background: #000; text-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
                            <canvas id="pdf-render" style="max-width: 100%;"></canvas>
                            <div id="placeholder" style="color: #888; text-transform: uppercase; letter-spacing: 2px; font-size: 11px;">Initialize PDF Stream...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
