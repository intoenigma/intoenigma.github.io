<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Communication Link Intelligence</h2>
                        <p>Verify and deconstruct communication channel integrity through advanced syntax analysis protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group mb-4" style="display: flex; gap: 10px; background: #fbfbfb; padding: 25px; border: 1px dashed #007185; border-radius: 8px;">
                            <input type="email" id="email-input" placeholder="intercept@protocol.net" class="form-control" style="flex: 1; height: 40px; font-weight: 600;">
                            <button id="check-btn" class="btn btn-primary" style="height: 40px; padding: 0 30px; font-weight: 700;">VERIFY LINK</button>
                        </div>

                        <div id="result" class="hidden card" style="padding: 40px 20px; text-align: center; border: 1px solid #ddd; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                            <div id="icon" class="status-icon" style="font-size: 48px; margin-bottom: 20px;"></div>
                            <h3 id="message" style="font-size: 18px; font-weight: 800; color: #0f1111; margin: 0; text-transform: uppercase; letter-spacing: -0.5px;">Protocol Status Awaiting...</h3>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-shield-check" style="margin-right: 5px; color: #007185;"></i>
                            Verification Note: Link integrity is analyzed using standardized RFC-compliant syntax algorithms.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
