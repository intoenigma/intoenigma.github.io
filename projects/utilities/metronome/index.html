<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Rhythm Sync Metronome</h2>
                        <p>Coordinate temporal pulses with high-fidelity precision.</p>
                    </header>

                    <div class="tool-content text-center">
                        <div class="card mb-4" style="background: #fbfbfb; display: inline-block; padding: 30px 60px; border-radius: 8px;">
                            <span id="bpm-val" style="font-size: 80px; font-weight: 800; color: #e47911; line-height: 1; font-family: 'Open Sans', sans-serif;">100</span>
                            <span style="display: block; font-size: 11px; color: #565959; font-weight: 700; text-transform: uppercase; margin-top: 5px;">BPM PROTOCOL</span>
                        </div>

                        <div class="slider-wrap mb-4" style="max-width: 400px; margin: 0 auto;">
                            <input type="range" id="bpm-slider" min="40" max="220" value="100" class="form-control" style="height: 6px; padding: 0;">
                        </div>

                        <div class="controls mb-4" style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                            <button id="minus-btn" class="btn" style="width: 45px; height: 45px; border-radius: 50%; padding: 0; font-size: 20px;">-</button>
                            <button id="toggle-btn" class="btn btn-primary" style="width: 100px; height: 100px; border-radius: 50%; font-size: 16px; font-weight: 700;">START</button>
                            <button id="plus-btn" class="btn" style="width: 45px; height: 45px; border-radius: 50%; padding: 0; font-size: 20px;">+</button>
                        </div>

                        <div id="dot" style="width: 12px; height: 12px; border-radius: 50%; background: #e47911; margin: 0 auto; box-shadow: 0 0 10px rgba(228, 121, 17, 0.5); opacity: 0.2; transition: transform 0.05s;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
