<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Gen | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Signal Icon Intelligence</h2>
                        <p>Craft and synchronize localized identification glyphs for header protocol integration.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="width: 180px; height: 180px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px dashed #007185; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                            <canvas id="canvas" width="64" height="64" style="width: 120px; height: 120px; image-rendering: pixelated; border: 1px solid #eee;"></canvas>
                        </div>

                        <div class="editor-panel card mb-4" style="background: #fbfbfb; padding: 25px; border: 1px solid #ddd;">
                            <div class="form-group mb-4">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">GLYPH IDENTIFIER (MAX 2 NODES)</label>
                                <input type="text" id="text" value="IE" maxlength="2" class="form-control" style="height: 40px; font-weight: 800; font-family: monospace; font-size: 18px; text-align: center;">
                            </div>
                            
                            <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group mb-0">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">BASE PROTOCOL COLOR</label>
                                    <div style="display: flex; gap: 10px; align-items: center;">
                                        <input type="color" id="bg-color" value="#131921" style="height: 40px; width: 60px; border: 1px solid #ddd; border-radius: 4px; padding: 2px;">
                                        <span style="font-family: monospace; font-size: 11px; color: #565959;">BACKGROUND</span>
                                    </div>
                                </div>
                                <div class="form-group mb-0">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">GLYPH STROKE COLOR</label>
                                    <div style="display: flex; gap: 10px; align-items: center;">
                                        <input type="color" id="text-color" value="#febd69" style="height: 40px; width: 60px; border: 1px solid #ddd; border-radius: 4px; padding: 2px;">
                                        <span style="font-family: monospace; font-size: 11px; color: #565959;">GLYPH</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button id="download-btn" class="btn btn-primary" style="width: 100%; height: 45px; font-weight: 700;">DOWNLOAD ICO PROTOCOL</button>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-shapes" style="margin-right: 5px; color: #007185;"></i>
                            Identification Note: Glyphs are synthesized at 64x64 pixel resolution for optimal protocol recognition.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
