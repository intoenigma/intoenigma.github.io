<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>MD Intelligence</h2>
                        <p>Coordinate and visualize structured semantic documentation.</p>
                    </header>

                    <div class="tool-content">
                        <div class="editor-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; height: 600px;">
                            <div class="panel" style="display: flex; flex-direction: column;">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; margin-bottom: 5px;">Source Mark-up</label>
                                <textarea id="editor" placeholder="# Enigma Protocol&#10;&#10;Initialize documentation sequence..." class="form-control" style="flex: 1; resize: none; font-family: monospace; height: auto; font-size: 13px;"></textarea>
                            </div>
                            <div class="panel" style="display: flex; flex-direction: column;">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; margin-bottom: 5px;">Synthesized Visual</label>
                                <div id="preview" class="card" style="flex: 1; padding: 15px; overflow-y: auto; color: #333; line-height: 1.6; background: #fcfcfc;">
                                    <!-- Preview content -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
