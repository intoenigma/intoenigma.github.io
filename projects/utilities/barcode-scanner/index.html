<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Product Scanner Intelligence</h2>
                        <p>Real-time optical deconstruction for standardized industrial barcode protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="viewport card mb-4" style="position: relative; overflow: hidden; border: 1px solid #ddd; background: #000; aspect-ratio: 4/3; box-shadow: inset 0 0 50px rgba(0,0,0,0.5);">
                            <video id="video" autoplay style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8;"></video>
                            <div class="scan-line" style="position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #e47911; box-shadow: 0 0 15px #e47911; animation: scan 2s infinite linear; z-index: 10;"></div>
                            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 40px solid rgba(0,0,0,0.3); pointer-events: none;"></div>
                        </div>

                        <div class="result card" style="padding: 20px; text-align: center; background: #fbfbfb; border: 1px solid #ddd;">
                            <label style="font-size: 11px; font-weight: 700; color: #565959; display: block; margin-bottom: 5px;">DETECTED PROTOCOL IDENTIFIER</label>
                            <span id="result-code" style="font-family: monospace; font-size: 24px; font-weight: 800; color: #B12704; letter-spacing: 2px;">--</span>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px;">
                            <i class="fa-solid fa-camera" style="margin-right: 5px; color: #007185;"></i>
                            Camera access required for optical synchronization. Optimized for 1D industrial deconstruction.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <style>
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
