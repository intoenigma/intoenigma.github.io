<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Screen Capture Intelligence</h2>
                        <p>Synchronize and archive visual output streams from high-fidelity terminal nodes.</p>
                    </header>

                    <div class="tool-content">
                        <div class="preview-wrap card mb-4" style="background: #000; display: flex; align-items: center; justify-content: center; min-height: 400px; border-radius: 8px; overflow: hidden; position: relative;">
                            <video id="preview" autoplay muted class="preview-video" style="max-width: 100%; height: auto;"></video>
                            <div id="status-overlay" style="position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);">
                                <span style="width: 8px; height: 8px; border-radius: 50%; background: #999; display: inline-block;" id="status-dot"></span>
                                <span id="status-text">OFFLINE</span>
                            </div>
                        </div>

                        <div class="controls" style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                            <button id="start-btn" class="btn btn-primary" style="height: 45px; padding: 0 40px; font-weight: 700;">INITIATE CAPTURE</button>
                            <button id="stop-btn" class="btn" style="height: 45px; padding: 0 30px;" disabled>TERMINATE</button>
                        </div>

                        <div style="text-align: center;">
                            <a id="download-link" class="btn small hidden" style="background: #fffcf5; border-color: #ffd814; color: #B12704; font-weight: 700;">DOWNLOAD PERSISTENT ARTIFACT</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
