<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortress Check | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Fortress Check Analyzer</h2>
                        <p>Analyze access key entropy and encryption resilience.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; padding: 15px; display: flex; gap: 10px; align-items: center; border: 1px solid #ddd;">
                            <input type="password" id="password" placeholder="Enter security string..." class="form-control" style="flex: 1; height: 35px; border: none; box-shadow: none; background: transparent;">
                            <button id="toggle-view" class="btn" style="padding: 0 15px; height: 35px; font-size: 18px; background: transparent;">👁️</button>
                        </div>

                        <div class="strength-meter mb-2" style="width: 100%; height: 8px; border-radius: 10px; overflow: hidden; background: #eee; border: 1px solid #ddd;">
                            <div class="strength-bar" id="bar" style="width: 0%; height: 100%; transition: width 0.4s ease, background 0.4s ease;"></div>
                        </div>
                        <p id="label" style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase; text-align: right; margin-bottom: 25px;">Awaiting Input</p>

                        <div class="requirements-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                            <div id="req-len" class="card" style="padding: 15px; font-size: 12px; opacity: 0.5; background: #fbfbfb; border-style: dashed; text-align: center; border-color: #ddd;">8+ Characters</div>
                            <div id="req-num" class="card" style="padding: 15px; font-size: 12px; opacity: 0.5; background: #fbfbfb; border-style: dashed; text-align: center; border-color: #ddd;">Numeric Values</div>
                            <div id="req-sym" class="card" style="padding: 15px; font-size: 12px; opacity: 0.5; background: #fbfbfb; border-style: dashed; text-align: center; border-color: #ddd;">Special Symbols</div>
                            <div id="req-case" class="card" style="padding: 15px; font-size: 12px; opacity: 0.5; background: #fbfbfb; border-style: dashed; text-align: center; border-color: #ddd;">Mixed Casing</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
