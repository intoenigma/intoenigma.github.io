<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Hub | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Global Atlas Intelligence</h2>
                        <p>Coordinate and deconstruct geopolitical data across unified territory protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group mb-4" style="display: flex; gap: 10px;">
                            <input type="text" id="search-input" placeholder="Query Geopolitical Entity..." class="form-control" style="flex: 1; height: 40px; font-weight: 600;">
                            <button id="search-btn" class="btn btn-primary" style="height: 40px; padding: 0 30px; font-weight: 700;">EXECUTE QUERY</button>
                        </div>

                        <div id="result" class="hidden card" style="padding: 30px; text-align: center; background: #fff; border: 1px solid #ddd; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                            <div class="flag-container mb-4" style="text-align: center;">
                                <img id="flag" src="" alt="Geopolitical Identifier" style="max-width: 200px; height: auto; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);">
                            </div>
                            <h3 id="country-name" style="font-size: 24px; font-weight: 800; color: #0f1111; margin-bottom: 30px; letter-spacing: -0.5px;">Geopolitical Entity</h3>
                            
                            <div class="info-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px;">
                                <div class="info-item card" style="padding: 15px; background: #fbfbfb; border: 1px dashed #ddd; text-align: left;">
                                    <h4 style="color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 5px;">CAPITAL NODE</h4>
                                    <span id="capital" style="font-size: 14px; font-weight: 700; color: #B12704;">--</span>
                                </div>
                                <div class="info-item card" style="padding: 15px; background: #fbfbfb; border: 1px dashed #ddd; text-align: left;">
                                    <h4 style="color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 5px;">POPULATION DATA</h4>
                                    <span id="population" style="font-size: 14px; font-weight: 700; color: #B12704;">--</span>
                                </div>
                                <div class="info-item card" style="padding: 15px; background: #fbfbfb; border: 1px dashed #ddd; text-align: left;">
                                    <h4 style="color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 5px;">TERRITORY REGION</h4>
                                    <span id="region" style="font-size: 14px; font-weight: 700; color: #B12704;">--</span>
                                </div>
                                <div class="info-item card" style="padding: 15px; background: #fbfbfb; border: 1px dashed #ddd; text-align: left;">
                                    <h4 style="color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 5px;">FISCAL PROTOCOL</h4>
                                    <span id="currency" style="font-size: 14px; font-weight: 700; color: #B12704;">--</span>
                                </div>
                            </div>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-earth-americas" style="margin-right: 5px; color: #007185;"></i>
                            Data Analytics Note: Synchronized with the Global Geopolitical Hub API.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
