<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Cash Flow Intelligence</h2>
                        <p>Analyze and deconstruct financial liquidity protocols within a unified ledger schema.</p>
                        
                        <div class="balance-display card" style="display: inline-block; padding: 20px 40px; border-radius: 8px; margin-top: 20px; background: #fbfbfb; border: 1px solid #ddd; text-align: center;">
                            <span style="font-size: 11px; color: #565959; display: block; margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">CURRENT LIQUIDITY</span>
                            <span id="balance" style="font-size: 32px; font-weight: 800; color: #B12704; letter-spacing: -1px;">$0.00</span>
                        </div>
                    </header>

                    <div class="tool-content">
                        <div class="transaction-form card mb-4" style="display: grid; grid-template-columns: 1fr 150px 100px; gap: 10px; padding: 20px; background: #fbfbfb; border: 1px dashed #007185;">
                            <input type="text" id="desc" placeholder="Protocol Label (e.g. Server Maintenance)..." class="form-control" style="height: 35px;">
                            <input type="number" id="amount" placeholder="Value Vector..." class="form-control" style="height: 35px;">
                            <button id="add-btn" class="btn btn-primary" style="height: 35px; font-weight: 700;">APPEND</button>
                        </div>

                        <div class="history-container card" style="min-height: 250px; background: #fff; border: 1px solid #ddd; padding: 0; overflow: hidden;">
                            <div style="background: #f1f1f1; padding: 12px 20px; border-bottom: 1px solid #ddd;">
                                <h4 style="margin: 0; color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">LEDGER HISTORY PROTCOLS</h4>
                            </div>
                            <ul id="history" class="history-list" style="list-style: none; padding: 20px; margin: 0; display: flex; flex-direction: column; gap: 10px;">
                                <div style="text-align: center; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding-top: 40px;">No Active Transactions Synthesized...</div>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
