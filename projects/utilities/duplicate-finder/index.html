<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Finder | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Redundancy Purge Intelligence</h2>
                        <p>Deconstruct and eliminate duplicate data protocols with absolute precision within a unified refinement schema.</p>
                    </header>

                    <div class="tool-content">
                        <div class="io-grid mb-4" style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: stretch;">
                            <div class="form-group mb-0">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">RAW INPUT DATASET</label>
                                <textarea id="input-list" placeholder="Initialize data stream for deconstruction..." class="form-control" style="height: 350px; font-family: monospace; font-size: 13px; resize: none; border-style: dashed;"></textarea>
                            </div>
                            <div class="sync-node" style="display: flex; align-items: center; justify-content: center; padding: 0 10px;">
                                <i class="fa-solid fa-right-long" style="font-size: 24px; color: #007185; opacity: 0.3;"></i>
                            </div>
                            <div class="form-group mb-0">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">REFINED OUTPUT PROTOCOL</label>
                                <textarea id="output-list" placeholder="Awaiting purge sequence..." class="form-control" style="height: 350px; font-family: monospace; font-size: 13px; resize: none; background: #fbfbfb;" readonly></textarea>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 15px;">
                            <button id="clean-btn" class="btn btn-primary" style="flex: 1; height: 45px; font-weight: 700;">EXECUTE PURGE SEQUENCE</button>
                            <div id="stats-display" class="card" style="margin: 0; padding: 0 25px; height: 45px; display: flex; align-items: center; background: #fbfbfb; border: 1px solid #ddd;">
                                <span style="font-size: 11px; font-weight: 700; color: #565959; margin-right: 10px;">PURGED NODES:</span>
                                <span id="stats-count" style="font-weight: 800; color: #B12704; font-size: 18px;">0</span>
                            </div>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-filter-circle-xmark" style="margin-right: 5px; color: #007185;"></i>
                            Purge Note: Redundant entries are deconstructed using line-by-line semantic uniqueness protocols.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
    <script>
        // Update script.js integration if necessary
        const statsCount = document.getElementById('stats-count');
        const originalClean = document.getElementById('clean-btn').onclick;
    </script>
</body>
</html>
