<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Filters | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Vibe Studio</h2>
                        <p>Apply atmospheric visual re-synchronization filters to images.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card text-center mb-3" style="background: #fbfbfb; border-style: dashed; padding: 20px;">
                            <input type="file" id="upload" accept="image/*" class="form-control mb-3">
                            <canvas id="canvas" style="max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px; display: none; margin: 0 auto; background: #000;"></canvas>
                        </div>

                        <div class="filters-grid mb-4" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;">
                            <button onclick="applyFilter('none')" class="btn">Normal</button>
                            <button onclick="applyFilter('grayscale(100%)')" class="btn">B&W</button>
                            <button onclick="applyFilter('sepia(100%)')" class="btn">Sepia</button>
                            <button onclick="applyFilter('invert(100%)')" class="btn">X-Ray</button>
                            <button onclick="applyFilter('blur(5px)')" class="btn">Soft Blur</button>
                        </div>

                        <button id="download" class="btn btn-primary" style="width: 100%; display: none; height: 40px; font-weight: 700;">Export Visual Data</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
