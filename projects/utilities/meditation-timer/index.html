<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditation Timer | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Neural Silence</h2>
                        <p>Protocol for biological frequency stabilization.</p>
                    </header>

                    <div class="tool-content text-center">
                        <div class="timer-display" style="position: relative; width: 280px; height: 280px; margin: 2rem auto; display: flex; align-items: center; justify-content: center; background: #fbfbfb; border-radius: 50%; border: 1px solid #eee; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);">
                            <svg class="progress-ring" width="280" height="280" style="position: absolute; top: 0; left: 0; transform: rotate(-90deg);">
                                <circle class="progress-ring__background" stroke="#eee" stroke-width="4" fill="transparent" r="130" cx="140" cy="140" />
                                <circle class="progress-ring__circle" stroke="#e47911" stroke-width="6" fill="transparent" r="130" cx="140" cy="140" style="transition: stroke-dashoffset 0.3s; stroke-linecap: round;" />
                            </svg>
                            <div id="time-text" style="font-size: 3.5rem; font-weight: 700; color: #0f1111; font-family: 'Open Sans', sans-serif;">05:00</div>
                        </div>

                        <div class="presets mb-4" style="display: flex; gap: 10px; justify-content: center;">
                            <button class="btn" onclick="setTime(300)" style="width: 70px;">05M</button>
                            <button class="btn" onclick="setTime(600)" style="width: 70px;">10M</button>
                            <button class="btn" onclick="setTime(1200)" style="width: 70px;">20M</button>
                        </div>

                        <button id="toggle-btn" class="btn btn-primary" style="width: 100%; height: 40px; max-width: 300px; font-weight: 700;">Initiate Stillness</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
