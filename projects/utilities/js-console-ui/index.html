<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Console | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Script Engine Console</h2>
                        <p>Real-time JavaScript execution environment for rapid prototyping.</p>
                    </header>

                    <div class="tool-content">
                        <div id="logs" class="card mb-4" style="height: 400px; background: #111; color: #00ff00; font-family: 'Courier New', Courier, monospace; font-size: 13px; overflow-y: auto; padding: 15px; border: 1px solid #333;">
                            <div class="log-line info" style="color: #888;">// Intelligence System Online - Awaiting Input...</div>
                        </div>

                        <div class="card" style="background: #fbfbfb; display: flex; gap: 10px; align-items: center; padding: 10px 15px;">
                            <span style="color: #e47911; font-weight: 800; font-family: monospace;">&gt;</span>
                            <input type="text" id="cmd" placeholder="console.log('Hello World');" autocomplete="off" class="form-control" style="border: none; box-shadow: none; background: transparent; flex: 1;">
                            <button id="run-btn" class="btn btn-primary" style="height: 31px; padding: 0 15px;">Execute</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
