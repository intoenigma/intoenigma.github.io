<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Vault | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Cryptographic Vault Intelligence</h2>
                        <p>Deconstruct and secure data payloads using standardized cryptographic obscuration protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group mb-4">
                            <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">DATA PAYLOAD SEGMENT</label>
                            <textarea id="data" placeholder="Intercepted information to be secured within the unified vault..." class="form-control" style="height: 250px; font-family: monospace; font-size: 13px; resize: none; border-style: dashed;"></textarea>
                        </div>
                        
                        <div class="form-group mb-4" style="background: #fbfbfb; padding: 20px; border: 1px solid #ddd; border-radius: 4px;">
                            <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">CRYPTOGRAPHIC AUTHENTICATION KEY</label>
                            <input type="password" id="key" placeholder="••••••••••••••••" class="form-control" style="height: 40px; font-size: 18px; letter-spacing: 2px;">
                        </div>

                        <div class="actions" style="display: flex; gap: 15px; margin-bottom: 30px;">
                            <button onclick="process('encrypt')" class="btn btn-primary" style="flex: 1; height: 45px; font-weight: 700;">SECURE FLOW</button>
                            <button onclick="process('decrypt')" class="btn btn-secondary" style="flex: 1; height: 45px; font-weight: 700; background: #fff; color: #0f1111; border: 1px solid #adb1b8; box-shadow: 0 2px 5px rgba(213,217,217,0.5);">RELEASE FLOW</button>
                        </div>

                        <div id="output" class="hidden card" style="background: #fff; border: 1px solid #ddd; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 30px;">
                            <h4 style="color: #565959; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; letter-spacing: 1px;">
                                <i class="fa-solid fa-microchip" style="margin-right: 8px; color: #007185;"></i>
                                PROCESSED CRYPTOGRAPHIC SIGNAL
                            </h4>
                            <div id="result-text" style="word-break: break-all; font-family: 'Courier New', monospace; color: #B12704; font-weight: 700; font-size: 14px; line-height: 1.6; background: #fbfbfb; padding: 15px; border-radius: 4px; border: 1px solid #eee;"></div>
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-user-shield" style="margin-right: 5px; color: #e47911;"></i>
                            Security Note: All cryptographic transformations occur locally within the client-side execution environment.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
