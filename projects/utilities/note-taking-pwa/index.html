<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma Notes | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Enigma Notes Archive</h2>
                        <p>Initialize private data logging and permanent archiving.</p>
                    </header>

                    <div class="tool-content">
                        <div class="note-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; height: 600px;">
                            <div class="card" style="background: #fbfbfb; display: flex; flex-direction: column; padding: 15px; border: 1px solid #ddd;">
                                <button id="new-btn" class="btn btn-primary" style="margin-bottom: 20px; width: 100%; font-weight: 700;">+ New Entry</button>
                                <div id="note-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                                    <!-- Note objects injected here -->
                                </div>
                            </div>

                            <div class="card" style="display: flex; flex-direction: column; padding: 25px; background: #fff; border: 1px solid #ddd;">
                                <input type="text" id="title-in" placeholder="Entry Label..." class="form-control" style="font-size: 24px; font-weight: 700; margin-bottom: 15px; border: none; box-shadow: none; padding: 0; height: auto;">
                                <textarea id="body-in" placeholder="Initialize data logging..." class="form-control" style="flex: 1; border: none; box-shadow: none; padding: 0; resize: none; font-size: 14px; line-height: 1.6; height: auto;"></textarea>
                                <div style="text-align: right; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                                    <button id="save-btn" class="btn btn-primary" style="height: 31px; padding: 0 25px; font-weight: 700;">Commit to Archive</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
