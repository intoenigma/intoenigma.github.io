<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link Creator | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Bio Builder Intelligence</h2>
                        <p>Architect and synchronize your digital identity matrix across global social protocols.</p>
                    </header>

                    <div class="tool-content" style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px;">
                        <div class="editor-section">
                            <div class="card mb-4" style="background: #fbfbfb; padding: 25px; border: 1px solid #ddd;">
                                <div class="form-group mb-3">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">IDENTITY IDENTIFIER</label>
                                    <input type="text" id="name" placeholder="John Doe" class="form-control" style="height: 35px;">
                                </div>
                                <div class="form-group mb-3">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">SEMANTIC SUMMARY</label>
                                    <textarea id="bio" placeholder="Digital Explorer & Creator" class="form-control" rows="2" style="height:auto; resize: none;"></textarea>
                                </div>

                                <div id="links-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>

                                <div class="actions" style="display: flex; flex-direction: column; gap: 10px;">
                                    <button id="add-link-btn" class="btn" style="width: 100%; border: 1px dashed #007185; color: #007185; font-weight: 700; height: 40px;">+ ATTACH SOCIAL NODE</button>
                                    <button id="download-btn" class="btn btn-primary" style="width: 100%; font-weight: 700; height: 45px;">EXPORT IDENTITY ARCHIVE</button>
                                </div>
                            </div>
                        </div>

                        <div class="preview-section" style="border-left: 1px solid #eee; padding-left: 30px;">
                            <div class="preview card" style="padding: 30px; text-align: center; background: #fff; border-style: double; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 400px; display: flex; flex-direction: column; align-items: center;">
                                <div class="avatar-circle" style="width: 70px; height: 70px; border-radius: 50%; background: #232f3e; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 15px; border: 3px solid #e47911;">
                                    <i class="fas fa-user"></i>
                                </div>
                                <h3 id="p-name" style="font-size: 18px; margin-bottom: 5px; color: #0f1111; font-weight: 800;">Profile Name</h3>
                                <p id="p-bio" style="color: #565959; font-size: 12px; margin-bottom: 25px; line-height: 1.4;">Architecting the digital future.</p>
                                <div id="p-links" class="p-links" style="width: 100%; display: flex; flex-direction: column; gap: 10px;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
