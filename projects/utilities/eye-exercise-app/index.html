<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Trainer | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card" style="padding: 0; overflow: hidden; background: #0f1111; border: 1px solid #333; position: relative; height: 600px;">
                    <!-- Ocular Target Node -->
                    <div id="ball" style="position: absolute; width: 30px; height: 30px; background: radial-gradient(circle, #ffd814 0%, #e47911 100%); border-radius: 50%; box-shadow: 0 0 30px rgba(228, 121, 17, 0.6); z-index: 10; display: none;"></div>
                    
                    <div id="ui-container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; width: 100%; max-width: 400px; padding: 20px;">
                        <div class="card" style="background: rgba(15, 17, 17, 0.9); border: 1px solid #444; padding: 40px;">
                            <header class="utility-header" style="border: none; margin-bottom: 20px; padding: 0;">
                                <h2 style="color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -1px; text-transform: uppercase;">OCULAR SYNC</h2>
                                <p id="instruction" style="color: #888; font-size: 13px; margin-top: 10px; line-height: 1.6;">Initialize optical recalibration protocol to relieve neural strain.</p>
                            </header>
                            <button id="start-btn" class="btn btn-primary" style="width: 100%; height: 45px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">INITIALIZE PROTOCOL</button>
                            
                            <p style="font-size: 10px; color: #555; margin-top: 25px; line-height: 1.4; text-transform: uppercase; letter-spacing: 1px;">
                                <i class="fa-solid fa-eye" style="margin-right: 5px; color: #e47911;"></i>
                                Follow the kinetic target node with absolute focus.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
