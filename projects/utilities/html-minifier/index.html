<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Minifier | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Payload Optimizer Intelligence</h2>
                        <p>Deconstruct and compress markup structures for high-speed transmission protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="io-grid mb-4" style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: stretch;">
                            <div class="form-group mb-0">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">SOURCE MARKUP VECTOR</label>
                                <textarea id="input" placeholder="Initialize unoptimized HTML stream..." class="form-control" style="height: 400px; font-family: monospace; font-size: 12px; resize: none; border-style: dashed;"></textarea>
                            </div>
                            <div class="sync-node" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; gap: 15px;">
                                <button id="minify-btn" class="btn btn-primary" style="height: 50px; width: 50px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;">
                                    <i class="fa-solid fa-compress" style="font-size: 20px;"></i>
                                </button>
                                <div id="stats" style="font-family: monospace; font-size: 10px; font-weight: 800; color: #B12704; writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 1px;">REDUCTION: --%</div>
                            </div>
                            <div class="form-group mb-0">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">OPTIMIZED BUFFER STREAM</label>
                                <textarea id="output" placeholder="Compressed payload output..." class="form-control" style="height: 400px; font-family: monospace; font-size: 12px; resize: none; background: #fbfbfb;" readonly></textarea>
                            </div>
                        </div>

                        <button id="copy-btn" class="btn btn-primary" style="width: 100%; height: 45px; font-weight: 700;">COPY OPTIMIZED PAYLOAD</button>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-microchip" style="margin-right: 5px; color: #007185;"></i>
                            Transmission Note: Optimization protocols deconstruct white-space and redundant attributes for minimal header overhead.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
