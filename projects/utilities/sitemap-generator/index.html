<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Builder | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>XML Map Intelligence</h2>
                        <p>Extract and deconstruct semantic link protocols into a standardized XML sitemap schema.</p>
                    </header>

                    <div class="tool-content">
                        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px;">
                            <div class="card" style="padding: 15px; background: #fbfbfb; border: 1px solid #ddd;">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; margin-bottom: 8px; display: block;">HTML SOURCE VECTOR</label>
                                <textarea id="html-in" placeholder="Paste source HTML code for link extraction..." class="form-control" style="height: 350px; font-family: monospace; font-size: 13px; resize: none; border: none; background: transparent;"></textarea>
                            </div>

                            <div class="card" style="padding: 15px; background: #fff; border: 1px solid #ddd;">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; margin-bottom: 8px; display: block;">SYNTHESIZED XML SCHEMA</label>
                                <textarea id="xml-out" placeholder="Generated sitemap XML artifact..." readonly class="form-control" style="height: 350px; font-family: monospace; font-size: 13px; resize: none; border: none; background: transparent;"></textarea>
                            </div>
                        </div>

                        <div class="actions" style="display: flex; gap: 10px; justify-content: flex-end;">
                            <button id="gen-btn" class="btn btn-primary" style="height: 40px; padding: 0 25px; font-weight: 700;">INITIALIZE GENERATION</button>
                            <button id="download-btn" class="btn" style="height: 40px; padding: 0 25px;">DOWNLOAD .XML</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
