<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Lookup | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Semantic Glyph Intelligence</h2>
                        <p>Deconstruct and retrieve encoded character protocols for high-fidelity web interface integration.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group mb-4" style="background: #fbfbfb; padding: 25px; border: 1px dashed #007185; border-radius: 8px;">
                            <div style="position: relative;">
                                <i class="fa-solid fa-code" style="position: absolute; left: 15px; top: 13px; color: #007185;"></i>
                                <input type="text" id="search" placeholder="Query entity node (e.g. arrow, copyright, delta)..." class="form-control" style="height: 45px; padding-left: 45px; font-weight: 700; font-size: 14px;">
                            </div>
                        </div>

                        <div id="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-height: 550px; overflow-y: auto; padding-right: 15px; border: 1px solid #eee; padding: 20px; background: #fff; border-radius: 4px;">
                            <!-- Entity components injected dynamically -->
                        </div>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-font-awesome" style="margin-right: 5px; color: #007185;"></i>
                            Encoding Note: Semantic protocols align with standardized W3C HTML5 character reference specifications.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
