<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortener | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>URL Shrink Intelligence</h2>
                        <p>Deconstruct and compress long-form resource vectors into efficient semantic identifiers.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; padding: 25px; border: 1px solid #ddd; display: flex; gap: 10px;">
                            <input type="text" id="url-in" placeholder="Enter universal resource locator (https://...)" class="form-control" style="flex: 1; height: 35px;">
                            <button id="shorten-btn" class="btn btn-primary" style="height: 35px; font-weight: 700; padding: 0 20px;">INITIALIZE SHRINK</button>
                        </div>

                        <div id="result" class="result hidden card" style="background: #fff; border: 1px dashed #007185; padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                            <span id="short-url" style="font-family: monospace; font-size: 18px; font-weight: 700; color: #007185;">ie.link/xyz</span>
                            <button id="copy-btn" class="btn" style="height: 31px; font-size: 12px; font-weight: 700;">COPY IDENTIFIER</button>
                        </div>

                        <p style="font-size: 11px; color: #565959; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px;">
                            <i class="fa-solid fa-flask" style="margin-right: 5px; color: #007185;"></i>
                            Protocol Note: This interface utilizes a simulated compression algorithm. Backend synchronization is required for permanent resource redirection.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
