<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binaural Beats | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Brainwave Sync Intelligence</h2>
                        <p>Deconstruct and synchronize neural frequency protocols for cognitive optimization.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; padding: 25px; border: 1px solid #ddd;">
                            <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group mb-0">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">LEFT NODE (HZ)</label>
                                    <input type="number" id="left-freq" value="200" class="form-control" style="height: 40px; font-weight: 700;">
                                </div>
                                <div class="form-group mb-0">
                                    <label style="font-size: 11px; font-weight: 700; color: #565959;">RIGHT NODE (HZ)</label>
                                    <input type="number" id="right-freq" value="210" class="form-control" style="height: 40px; font-weight: 700;">
                                </div>
                            </div>
                        </div>

                        <div class="presets mb-4" style="display: flex; gap: 10px;">
                            <button onclick="setFreq(200, 204)" class="btn" style="flex: 1; height: 40px; font-size: 11px; font-weight: 700; border: 1px solid #ddd; background: #fff;">THETA PROTOCOL</button>
                            <button onclick="setFreq(200, 210)" class="btn" style="flex: 1; height: 40px; font-size: 11px; font-weight: 700; border: 1px solid #ddd; background: #fff;">ALPHA PROTOCOL</button>
                            <button onclick="setFreq(200, 230)" class="btn" style="flex: 1; height: 40px; font-size: 11px; font-weight: 700; border: 1px solid #ddd; background: #fff;">BETA PROTOCOL</button>
                        </div>

                        <button id="toggle-btn" class="btn btn-primary" style="width: 100%; height: 45px; font-weight: 700;">INITIALIZE SIGNAL SYNC</button>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-headphones" style="margin-right: 5px; color: #007185;"></i>
                            Neurological alert: Stereo auditory nodes (headphones) are required for effective neural deconstruction.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
    <script>
        function setFreq(l, r) {
            document.getElementById('left-freq').value = l;
            document.getElementById('right-freq').value = r;
        }
    </script>
</body>
</html>
