<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Meaning | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Identity Reveal Analyzer</h2>
                        <p>Decrypt the semantic origins and character traits of biological identifiers.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; padding: 15px; display: flex; gap: 10px; border: 1px solid #ddd;">
                            <input type="text" id="name-input" placeholder="Enter biological label..." class="form-control" style="flex: 1; height: 35px; border-radius: 4px;">
                            <button id="find-btn" class="btn btn-primary" style="height: 35px; min-width: 120px; font-weight: 700;">Analyze</button>
                        </div>

                        <div id="result-box" class="card result hidden" style="padding: 40px; text-align: center; background: #fffcf5; border-color: #ffd814;">
                            <h1 id="r-name" style="font-size: 48px; margin-bottom: 5px; color: #0f1111; font-weight: 800;">Name</h1>
                            <p id="r-meaning" style="color: #565959; font-size: 16px; margin-bottom: 25px; line-height: 1.6;">Meaning data stream...</p>
                            <div class="traits" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                                <span class="trait btn" style="border-radius: 40px; font-size: 11px; padding: 2px 15px; background: #fff; cursor: default;">Creative</span>
                                <span class="trait btn" style="border-radius: 40px; font-size: 11px; padding: 2px 15px; background: #fff; cursor: default;">Bold</span>
                                <span class="trait btn" style="border-radius: 40px; font-size: 11px; padding: 2px 15px; background: #fff; cursor: default;">Loyal</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
