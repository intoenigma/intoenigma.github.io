<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist PDF | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling (3 levels deep) -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../utility-base.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="utility-header">
                        <h2>Export Intelligence</h2>
                        <p>Transform raw objective protocols into standardized PDF documentation for permanent archiving.</p>
                    </header>

                    <div class="tool-content">
                        <div class="card mb-4" style="background: #fbfbfb; border: 1px dashed #007185; padding: 25px;">
                            <div class="form-group mb-4">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">DOCUMENT IDENTIFIER</label>
                                <input type="text" id="pdf-title" placeholder="Operation Log Alpha..." class="form-control" style="height: 40px; font-weight: 600;">
                            </div>
                            <div class="form-group">
                                <label style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">PROTOCOL ENTRIES (ONE PER LINE)</label>
                                <textarea id="pdf-content" placeholder="Objective Node 1&#10;Objective Node 2&#10;Objective Node 3" class="form-control" rows="8" style="height:auto; min-height:200px; resize: none; font-family: monospace; font-size: 13px;"></textarea>
                            </div>
                        </div>

                        <button id="generate-btn" class="btn btn-primary" style="width: 100%; height: 45px; font-weight: 700;">GENERATE PROTOCOL PDF</button>

                        <p style="font-size: 11px; color: #565959; text-align: center; margin-top: 25px; line-height: 1.6; border-top: 1px solid #eee; padding-top: 15px; font-style: italic;">
                            <i class="fa-solid fa-file-pdf" style="margin-right: 5px; color: #B12704;"></i>
                            Documentation Note: Archive synthesized via jsPDF Engine.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <!-- Layout Engine (3 levels deep) -->
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
