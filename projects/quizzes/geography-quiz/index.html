<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Scan | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/quiz-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="quiz-header">
                        <h2>Geography Scan Protocol</h2>
                        <p>Evaluate global positioning and geopolitical data accuracy.</p>
                    </header>

                    <div style="display: flex; gap: 20px; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                        <div id="score-display" style="font-weight: 700;">POINTS: <span id="score" style="color: #007185;">0</span></div>
                    </div>

                    <div class="display-area" style="background: #fbfbfb; border: 1px solid #ddd; padding: 40px; text-align: center; border-radius: 4px;">
                        <h3 style="font-size: 14px; text-transform: uppercase; color: #565959; margin-bottom: 10px;">Identify Capital City</h3>
                        <h2 id="country-display" style="font-size: 48px; font-weight: 800; color: #e47911; margin-bottom: 30px;">COUNTRY</h2>

                        <div id="options-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 600px; margin: 0 auto;">
                            <!-- Buttons generated by script.js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
