<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Learner | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/quiz-base.css">
    <style>
        .letter-tile {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.2s;
        }
        .letter-tile:hover {
            background: #f0f2f2;
            border-color: #a6a6a6;
        }
        .letter-tile.active {
            background: #e47911;
            color: #fff;
            border-color: #e47911;
        }
        #letter-display {
            font-size: 120px;
            font-weight: 700;
            color: #e47911;
            margin-bottom: 10px;
        }
        #word-hint {
            font-size: 28px;
            color: #565959;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="quiz-header">
                        <h2>Alphabet Learner Protocol</h2>
                        <p>Interactive auditory and visual foundation blocks for early linguistic acquisition.</p>
                    </header>

                    <div class="display-area" style="background: #fbfbfb; border: 1px solid #ddd; padding: 40px; text-align: center; border-radius: 4px; margin-bottom: 20px;">
                        <div id="letter-display">A</div>
                        <div id="word-hint">Apple</div>
                    </div>

                    <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 30px;">
                        <button id="prev-btn" class="btn btn-secondary" style="width: 120px; height: 35px;"><i class="fas fa-chevron-left"></i> Previous</button>
                        <button id="speak-btn" class="btn btn-primary" style="width: 120px; height: 35px;"><i class="fas fa-volume-up"></i> Listen</button>
                        <button id="next-btn" class="btn btn-secondary" style="width: 120px; height: 35px;">Next <i class="fas fa-chevron-right"></i></button>
                    </div>

                    <div class="alphabet-grid" id="alphabet-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px;">
                        <!-- Letters generated by script.js -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
