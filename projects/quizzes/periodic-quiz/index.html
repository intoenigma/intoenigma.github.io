<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Hunter | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/quiz-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="quiz-header">
                        <h2>Element Hunter Protocol</h2>
                        <p>Analyze and identify chemical elements from the periodic spectrum.</p>
                    </header>

                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div class="stat-card" style="flex: 1; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 4px; text-align: center;">
                            <div style="font-size: 11px; font-weight: 700; color: #565959; text-transform: uppercase;">SCORE</div>
                            <div id="score" style="font-size: 20px; font-weight: 700; color: #007185;">0</div>
                        </div>
                    </div>

                    <div class="display-area" style="background: #fbfbfb; border: 1px solid #ddd; padding: 40px; text-align: center; border-radius: 4px;">
                        <div id="symbol-display" style="font-size: 100px; font-weight: 800; color: #e47911; margin-bottom: 5px;">H</div>
                        <div id="number-display" style="font-size: 18px; color: #565959; margin-bottom: 30px;">Atomic Number: 1</div>

                        <div id="options-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: 0 auto;">
                            <!-- Buttons generated by script.js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
