<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Stream | IntoEnigma</title>
    <!-- Common Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/quiz-base.css">
    <style>
        .quote-display {
            font-size: 24px;
            line-height: 1.6;
            color: #565959;
            margin-bottom: 30px;
            user-select: none;
            letter-spacing: 1px;
            text-align: left;
        }
        .correct { color: #007185; }
        .incorrect { color: #c40000; text-decoration: underline; }
        .current { border-bottom: 3px solid #e47911; }
        .stats-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: #fbfbfb;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 700;
        }
        #typing-area {
            width: 100%;
            height: 100px;
            border: 1px solid #888c8c;
            border-radius: 4px;
            padding: 15px;
            font-size: 18px;
            outline: none;
            resize: none;
        }
        #typing-area:focus { border-color: #e47911; }
    </style>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="card">
                    <header class="quiz-header">
                        <h2>Input Stream Protocol</h2>
                        <p>High-fidelity data entry benchmarking system.</p>
                    </header>

                    <div class="stats-area">
                        <div class="stat-item">WPM: <span id="wpm">0</span></div>
                        <div class="stat-item">ACC: <span id="acc">100</span>%</div>
                        <div class="stat-item">TIME: <span id="timer">30</span>s</div>
                    </div>

                    <div class="display-area" style="text-align: left; background: #fff; padding: 30px;">
                        <textarea id="typing-area" placeholder="Click here to begin transmission..."></textarea>
                        <div id="quote-display" class="quote-display">Initialising stream...</div>
                        <button onclick="resetTest()" class="btn btn-secondary">RESET STREAM</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
