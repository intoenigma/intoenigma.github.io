<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Picsum | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../generator-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="app-header" style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
                        <h2 style="font-size:22px; font-weight:800; color:#0f1111; margin-bottom:5px;">Lorem Picsum</h2>
                        <p style="color:#565959; font-size:13.5px;">Fetch high-fidelity placeholders from the central visual cluster.</p>
                    </header>
                    <div class="visual-display-wrapper">
<div class="visual-frame">
<img alt="Synthesized Visual" id="lorem-img" src="https://picsum.photos/400/300"/>
<div class="loading-overlay" id="loading">
<div class="spinner"></div>
</div>
</div>
</div>
<div class="io-grid">
<div class="form-group">
<label class="io-label">Dimensions (W x H)</label>
<div class="dimension-inputs">
<input  id="w" placeholder="Width" type="number" value="400"/>
<input  id="h" placeholder="Height" type="number" value="300"/>
</div>
</div>
<div class="form-group">
<label class="io-label">Visual Filters</label>
<div class="filter-options">
<label class="check-container">
<input id="gray" type="checkbox"/>
<span class="checkmark"></span>
                            Grayscale
                        </label>
<label class="check-container">
<input id="blur" type="checkbox"/>
<span class="checkmark"></span>
                            Gaussian Blur
                        </label>
</div>
</div>
</div>
<button class="btn btn-primary" id="gen-trigger" onclick="fetchImage()">
<i class="fas fa-camera-retro"></i> Capture Visual
            </button>
<div class="url-output glass">
<p class="system-tag">SOURCE_URL</p>
<code id="url-out">https://picsum.photos/400/300</code>
<button class="copy-btn" onclick="copyUrl()"><i class="fas fa-copy"></i></button>
</div>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
