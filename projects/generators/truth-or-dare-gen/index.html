<head>

        <div id="enigma-breadcrumbs"></div>

                <div class="card">

                    <div class="td-display-wrapper">
<div class="td-card glass">

</div>

</div>
</div>
<div class="io-grid">
<button class="btn btn-primary  truth-trigger" onclick="getTruth()">
<i class="fas fa-eye"></i> Integrity (Truth)
                </button>

                </div>
