<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Bank | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../generator-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="app-header" style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
                        <h2 style="font-size:22px; font-weight:800; color:#0f1111; margin-bottom:5px;">Meme Bank</h2>
                        <p style="color:#565959; font-size:13.5px;">Access the global repository of socio-cultural communication templates.</p>
                    </header>
                    <div class="meme-display-container">
                        <div id="meme-detail-view">
                            <div class="loading-state">
                                <div class="spinner"></div>
                                <p>Finding a fresh template...</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="action-row" style="margin-top:25px; display:flex; gap:10px; justify-content:center;">
                        <button class="btn btn-primary" id="gen-trigger" onclick="getNewMeme()" style="flex:1; max-width:250px;">
                            <i class="fas fa-random"></i> Next Random Template
                        </button>
                        <button class="btn btn-secondary" id="download-btn" onclick="downloadMeme()" style="flex:1; max-width:200px; background:#eaeded; border:1px solid #d5d9d9; color:#0f1111;">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
