<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Synthesizer (Generator) | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../generator-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="app-header" style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
                        <h2 style="font-size:22px; font-weight:800; color:#0f1111; margin-bottom:5px;">Avatar Synthesizer (Generator)</h2>
                        <p style="color:#565959; font-size:13.5px;">Generate unique cryptographic identities based on input seeds.</p>
                    </header>
                    <div class="avatar-display-wrapper">
<div class="avatar-frame">
<img alt="Generated Identity" id="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=Enigma"/>
</div>
</div>
<div class="io-grid">
<div class="form-group">
<label class="io-label" for="seed">Identity Seed</label>
<input  id="seed" placeholder="Enter unique identifier..." type="text"/>
</div>
<div class="form-group">
<label class="io-label" for="style-sel">Protocol Type</label>
<select  id="style-sel">
<option value="adventurer">Adventurer</option>
<option value="avataaars">Avataaars</option>
<option selected="" value="bottts">Bottts (Robotic)</option>
<option value="fun-emoji">Fun Emoji</option>
<option value="lorelei">Lorelei</option>
<option value="pixel-art">Pixel Art</option>
</select>
</div>
</div>
<button class="btn btn-primary" id="gen-trigger" onclick="generate()">
<i class="fas fa-sync-alt"></i> Execute Synthesis
            </button>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
