<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Cluster | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../generator-base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="app-header" style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
                        <h2 style="font-size:22px; font-weight:800; color:#0f1111; margin-bottom:5px;">Semantic Cluster</h2>
                        <p style="color:#565959; font-size:13.5px;">Visualize linguistic density and keyword frequency in a multi-dimensional
                    cloud.</p>
                    </header>
                    <div class="form-group">
<label class="io-label" for="text-input">Raw Text Data</label>
<textarea class="glass-input" id="text-input" placeholder="Paste semantic payload for analysis..."></textarea>
</div>
<div class="cloud-display-wrapper">
<div class="cloud-output glass" id="cloud-output">

<div class="cloud-container" id="cloud-container">
<p class="placeholder">Awaiting text payload...</p>
</div>
</div>
</div>
<button class="btn btn-primary" id="gen-trigger" onclick="generateCloud()">
<i class="fas fa-project-diagram"></i> Execute Clustering
            </button>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
