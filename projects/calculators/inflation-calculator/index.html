<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflation Tracker | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Inflation Tracker</h2>
                        <p>Estimate the erosion of purchasing power and future costs based on annual inflation rates.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label>Current Cost ($)</label>
                            <input type="number" id="current-cost" placeholder="e.g. 100" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Inflation Rate (%)</label>
                            <input type="number" id="inflation-rate" placeholder="e.g. 3.5" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Years in Future</label>
                            <input type="number" id="years" placeholder="e.g. 10" class="form-control">
                        </div>
                        <button id="calculate-btn" class="btn btn-primary btn-block">Project Future Value</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card">
                                    <span id="future-value" class="number">0</span>
                                    <span class="label">Future Cost</span>
                                </div>
                                <div class="result-card">
                                    <span id="change-percent" class="number">0</span>
                                    <span class="label">Price Increase</span>
                                </div>
                            </div>
                            <p class="text-muted text-center mt-3 small">
                                Compounded annual inflation drastically alters value protocols over decades.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
