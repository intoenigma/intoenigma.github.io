<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Analyzer | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>BMI Analyzer</h2>
                        <p>Calculate your Body Mass Index against standardized health protocols for optimal wellness monitoring.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-section">
                            <div class="form-group">
                                <label>Height (cm)</label>
                                <input type="number" id="height" placeholder="e.g. 175" class="form-control">
                            </div>
                            <div class="form-group mt-3">
                                <label>Weight (kg)</label>
                                <input type="number" id="weight" placeholder="e.g. 70" class="form-control">
                            </div>
                            <button id="calculate-btn" class="btn btn-primary btn-block mt-4">Calculate BMI</button>
                        </div>

                        <div class="result-section hidden mt-4" id="result-section">
                            <div class="text-center mb-4">
                                <span class="text-muted small text-uppercase spacing-2">CALCULATED INDEX</span>
                                <span id="bmi-value" class="d-block number highlight" style="font-size: 4rem; display: block; margin: 0.5rem 0;">0.0</span>
                            </div>

                            <div class="gauge-container">
                                <div id="gauge-bar" class="gauge-fill"></div>
                            </div>
                            <p id="category-text" class="category-text highlight text-center mt-3 text-uppercase fw-bold">Normal</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
