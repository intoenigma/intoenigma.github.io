<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratuity Node | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Gratuity Node</h2>
                        <p>Calculate end-of-service benefits and tenure rewards based on standard protocols.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label>Monthly Basic Salary + DA ($)</label>
                            <input type="number" id="salary" placeholder="e.g. 5000" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Years of Service</label>
                            <input type="number" id="years" placeholder="e.g. 5" class="form-control">
                        </div>
                        <button id="calculate-btn" class="btn btn-primary btn-block">Calculate Gratuity</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid" style="grid-template-columns: 1fr;">
                                <div class="result-card">
                                    <span id="gratuity-val" class="number">0</span>
                                    <span class="label">Total Gratuity Payable</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
