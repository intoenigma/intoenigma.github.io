<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Comparator | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
    <style>
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Value Comparator</h2>
                        <p>Execute side-by-side unit cost analysis to optimize product value and shopping decisions.</p>
                    </header>

                    <div class="tool-content">
                        <div class="comparison-grid">
                            <!-- Item A -->
                            <div class="item-block">
                                <h3 class="mb-3">Item Alpha</h3>
                                <div class="form-group">
                                    <label>Price ($)</label>
                                    <input type="number" id="price-a" class="form-control" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label>Quantity / Weight</label>
                                    <input type="number" id="qty-a" class="form-control" step="0.01">
                                </div>
                            </div>

                            <!-- Item B -->
                            <div class="item-block">
                                <h3 class="mb-3">Item Beta</h3>
                                <div class="form-group">
                                    <label>Price ($)</label>
                                    <input type="number" id="price-b" class="form-control" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label>Quantity / Weight</label>
                                    <input type="number" id="qty-b" class="form-control" step="0.01">
                                </div>
                            </div>
                        </div>

                        <button id="calculate-btn" class="btn btn-primary btn-block">Compare Unit Prices</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card" id="card-a">
                                    <span id="unit-a" class="number">0</span>
                                    <span class="label">Item Alpha / Unit</span>
                                </div>
                                <div class="result-card" id="card-b">
                                    <span id="unit-b" class="number">0</span>
                                    <span class="label">Item Beta / Unit</span>
                                </div>
                            </div>
                            <p id="verdict" class="text-center mt-4 h4 font-weight-bold text-uppercase"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
