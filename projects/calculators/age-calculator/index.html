<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Age Calculator</h2>
                        <p>Calculate your exact age in years, months, and days based on your date of birth.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" class="form-control" required>
                            <button id="calculate-btn" class="btn btn-primary btn-block mt-3">Calculate Age</button>
                        </div>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card">
                                    <span id="years" class="number">0</span>
                                    <span class="label">Years</span>
                                </div>
                                <div class="result-card">
                                    <span id="months" class="number">0</span>
                                    <span class="label">Months</span>
                                </div>
                                <div class="result-card">
                                    <span id="days" class="number">0</span>
                                    <span class="label">Days</span>
                                </div>
                            </div>
                            <p class="next-bday-text text-center mt-3">Next birthday in <span id="next-birthday-days" class="highlight strong">0</span> days.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
