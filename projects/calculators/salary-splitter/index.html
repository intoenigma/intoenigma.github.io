<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Optimizer | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Budget Optimizer</h2>
                        <p>Execute 50/30/20 budget allocation protocols for financial stability and wealth growth.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label>Monthly Net Income ($)</label>
                            <input type="number" id="income" placeholder="e.g. 4000" class="form-control">
                        </div>
                        <button id="calculate-btn" class="btn btn-primary btn-block">Initialize Allocation</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card">
                                    <span id="needs" class="number">0</span>
                                    <span class="label">Needs (50%)</span>
                                </div>
                                <div class="result-card">
                                    <span id="wants" class="number">0</span>
                                    <span class="label">Wants (30%)</span>
                                </div>
                                <div class="result-card">
                                    <span id="savings" class="number">0</span>
                                    <span class="label">Savings (20%)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
