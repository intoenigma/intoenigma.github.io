<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Estimator | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Tax Estimator</h2>
                        <p>Evaluate your tax liability and net income projections based on custom rates and deductions.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label>Annual Income ($)</label>
                            <input type="number" id="income" placeholder="e.g. 60000" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Tax Rate (%)</label>
                            <input type="number" id="rate" placeholder="e.g. 20" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Deductions ($)</label>
                            <input type="number" id="deductions" placeholder="e.g. 12000" class="form-control">
                        </div>
                        <button id="calculate-btn" class="btn btn-primary btn-block">Execute Calculation</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card">
                                    <span id="taxable-income" class="number">0</span>
                                    <span class="label">Taxable Income</span>
                                </div>
                                <div class="result-card">
                                    <span id="tax-amount" class="number">0</span>
                                    <span class="label">Total Tax</span>
                                </div>
                                <div class="result-card">
                                    <span id="net-income" class="number">0</span>
                                    <span class="label">Net Income</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
