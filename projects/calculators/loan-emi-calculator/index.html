<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Core | IntoEnigma</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../calculator-base.css">
</head>
<body>
    <div id="enigma-header"></div>

    <main class="container">
        <div id="enigma-breadcrumbs"></div>

        <div class="content-layout">
            <!-- Sidebar: Managed dynamically by main.js -->
            <aside class="sidebar" id="enigma-sidebar"></aside>

            <div class="main-content">
                <div class="calc-container card">
                    <header class="calc-header">
                        <h2>Loan EMI Core</h2>
                        <p>Calculate your monthly payments, total interest, and complete repayment cost for any loan.</p>
                    </header>

                    <div class="tool-content">
                        <div class="form-group">
                            <label>Principal Amount ($)</label>
                            <input type="number" id="principal" placeholder="e.g. 10000" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Annual Interest Rate (%)</label>
                            <input type="number" id="rate" placeholder="e.g. 10" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Tenure (Months)</label>
                            <input type="number" id="months" placeholder="e.g. 24" class="form-control">
                        </div>
                        <button id="calculate-btn" class="btn btn-primary btn-block">Calculate EMI</button>

                        <div class="result-section hidden" id="result-section">
                            <div class="result-grid">
                                <div class="result-card">
                                    <span id="emi" class="number">0</span>
                                    <span class="label">Monthly Payment</span>
                                </div>
                                <div class="result-card">
                                    <span id="interest" class="number">0</span>
                                    <span class="label">Total Interest</span>
                                </div>
                                <div class="result-card">
                                    <span id="payable" class="number">0</span>
                                    <span class="label">Total Payable</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="enigma-footer"></div>

    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
