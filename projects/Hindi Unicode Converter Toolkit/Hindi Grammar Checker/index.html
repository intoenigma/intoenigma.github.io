<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Grammar Checker | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/hindi-base.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="hindi-header">
                        <h2>Hindi Grammar Checker — व्याकरण जाँचकर्ता</h2>
                        <p>Rule-based Hindi grammar checking: punctuation errors, common mistakes, spacing issues, and structural problems.</p>
                    </header>
                    <div class="form-group">
                        <label>हिन्दी टेक्स्ट यहाँ डालें</label>
                        <textarea id="input-text" class="form-control hindi-input" style="min-height:200px;"
                            placeholder="हिन्दी में लिखें या पेस्ट करें...&#10;&#10;Grammar rules checked:&#10;• Danda (।) placement&#10;• Space before punctuation&#10;• Common word errors&#10;• Repeated words&#10;• Missing anusvara"></textarea>
                    </div>
                    <div class="action-bar">
                        <button class="btn btn-primary" onclick="checkGrammar()"><i class="fas fa-spell-check"></i> Check Grammar</button>
                        <button class="btn btn-secondary" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
                    </div>
                    <div id="results" style="display:none; margin-top:15px;">
                        <div id="error-list"></div>
                        <div id="corrected" class="result-box" style="margin-top:15px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
