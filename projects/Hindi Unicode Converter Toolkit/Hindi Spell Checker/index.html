<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Spell Checker | IntoEnigma</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../shared/hindi-base.css">
</head>
<body>
    <div id="enigma-header"></div>
    <main class="container">
        <div id="enigma-breadcrumbs"></div>
        <div class="content-layout">
            <aside class="sidebar" id="enigma-sidebar"></aside>
            <div class="main-content">
                <div class="card">
                    <header class="hindi-header">
                        <h2>Hindi Spell Checker — वर्तनी जाँचकर्ता</h2>
                        <p>Detect common Hindi spelling errors and suggest corrections. Uses a curated dictionary of frequent misspellings.</p>
                    </header>
                    <div class="form-group">
                        <label>हिन्दी टेक्स्ट यहाँ डालें</label>
                        <textarea id="input-text" class="form-control hindi-input" style="min-height:200px;"
                            placeholder="हिन्दी में लिखें...&#10;&#10;Common errors detected:&#10;• प्रकार → परकार → प्रकार&#10;• आशिर्वाद → आशीर्वाद&#10;• उपरोक्त → उपयुक्त&#10;• प्रथक → पृथक"></textarea>
                    </div>
                    <div class="action-bar">
                        <button class="btn btn-primary" onclick="checkSpelling()"><i class="fas fa-check-double"></i> Check Spelling</button>
                        <button class="btn btn-secondary" onclick="autoCorrect()"><i class="fas fa-magic"></i> Auto-Correct All</button>
                        <button class="btn btn-secondary" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
                    </div>
                    <div id="results" style="display:none; margin-top:15px;">
                        <div id="error-summary" class="stat-strip" style="margin-bottom:15px;"></div>
                        <div id="highlighted" class="result-box" style="line-height:2.2;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="enigma-footer"></div>
    <script src="../../../js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
